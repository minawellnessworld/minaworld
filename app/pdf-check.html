<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>PDF 자동 입력 점검 · MINA WORLD</title>
  <link rel="stylesheet" href="./css/app.css?v=2.0.29">
  <style>
    .pdf-check-wrap { max-width: 430px; margin: 0 auto; padding: 16px 16px 60px; }
    .pdf-check-wrap h1 { font-size: 18px; margin: 8px 0 4px; }
    .pdf-check-wrap pre { white-space: pre-wrap; word-break: break-all; font-size: 10.5px; background: #f5f3ee; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="pdf-check-wrap">
    <h1>PDF 자동 입력 점검</h1>
    <p class="muted small">관리자·기관 결과 등록 폼과 같은 모듈로 PDF를 읽습니다. 이 화면은 DB에 아무것도 저장하지 않습니다.</p>

    <div class="admin-form">
      <div class="form-grid">
        <label class="field"><span class="field-label">검사 유형</span>
          <select id="res-type"><option value="simple">간편검사</option><option value="full">종합검사</option></select>
        </label>
        <label class="field"><span class="field-label">측정일</span><input type="date" id="res-date"></label>
      </div>
      <div class="form-grid">
        <label class="field"><span class="field-label">감정 성향</span><input type="text" id="res-emotion"></label>
        <label class="field"><span class="field-label">다음 재검사 권장일</span><input type="date" id="res-recheck"></label>
      </div>
      <div class="field"><span class="field-label">항목별 설명</span><div id="res-items" class="kv-list"></div><p class="field-hint" id="res-items-hint"></p></div>
      <label class="field"><span class="field-label">요약 코멘트</span><textarea id="res-summary" rows="2"></textarea></label>
      <label class="field"><span class="field-label">결과지 파일 (PDF · 이미지)</span><input type="file" id="res-file" accept="application/pdf,image/*"></label>
      <p class="field-hint">PDF를 첨부하면 측정일 · 감정 성향 · 항목별 설명이 자동으로 입력됩니다.</p>
      <div id="res-pdf-status" class="pdf-status" hidden></div>
    </div>

    <h2 class="admin-h4">파싱 결과(검증용)</h2>
    <pre id="pdf-dump">아직 첨부된 파일이 없습니다.</pre>
  </div>

  <script type="module">
    import { editorHtml, bindEditor, fillItemsDetailed } from './js/check-items.js?v=2.0.29';
    import { bindPdfAutofill, parseReport } from './js/pdf-parser.js?v=2.0.29';

    var itemsHost = document.getElementById('res-items');
    var template = document.createElement('div');
    template.innerHTML = editorHtml('res', 'full', { label: '항목별 설명' });
    itemsHost.innerHTML = template.querySelector('#res-items').innerHTML;
    var typeSelect = document.getElementById('res-type');
    var editor = bindEditor(document, 'res', '#res-type', function (msg) { console.log('[check-items]', msg); });
    /* bindEditor 는 document 루트에서 동작 (같은 id 사용) */
    if (editor) editor.apply();

    var dump = document.getElementById('pdf-dump');
    var fileInput = document.getElementById('res-file');

    bindPdfAutofill({
      fileInput: fileInput,
      statusEl: document.getElementById('res-pdf-status'),
      typeEl: typeSelect,
      fields: {
        date: document.getElementById('res-date'),
        emotion: document.getElementById('res-emotion'),
        summary: document.getElementById('res-summary')
      },
      fillItems: function (map, options) { return fillItemsDetailed(document.getElementById('res-items'), map, options); }
    });

    /* 점검용: 같은 파일을 다시 파싱해 원시 결과를 화면에 남깁니다 */
    fileInput.addEventListener('change', async function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) { dump.textContent = '아직 첨부된 파일이 없습니다.'; return; }
      dump.textContent = '파싱 중…';
      try {
        var report = await parseReport(file);
        dump.textContent = JSON.stringify(report, null, 2);
      } catch (err) {
        dump.textContent = 'ERROR: ' + (err && err.message ? err.message : String(err));
      }
    });
  </script>
</body>
</html>
